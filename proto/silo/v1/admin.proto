syntax = "proto3";

package silo.v1;

import "silo/v1/publish.proto";

option go_package = "github.com/BirknerAlex/silo/gen/go/silo/v1;silov1";

// AdminService covers everything that manages the registry rather than its
// contents: tokens, users, the audit log, and index repair. Every method
// requires an admin-permission credential.
service AdminService {
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetUserDisabled(SetUserDisabledRequest) returns (SetUserDisabledResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse);

  rpc QueryAudit(QueryAuditRequest) returns (QueryAuditResponse);

  // Rebuilds an index from the database. Repairs a bucket restored from
  // backup, or an index left stale by a crash mid-publish.
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse);
  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageResponse);

  // Sets a repo's mode. Public adds unauthenticated read; it never
  // changes who can write, and never revokes or deletes any token.
  rpc SetRepoMode(SetRepoModeRequest) returns (SetRepoModeResponse);

  // Creates a repo ahead of its first publish, so tokens can be scoped to
  // it before any package exists. Fails if the repo already exists.
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  // Deletes a repo. Fails if it has packages unless `force` is set, in
  // which case every package (all channels/formats) is deleted first.
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);

  // Configures, inspects, or clears a repo/channel's retention rule.
  rpc SetPruneRule(SetPruneRuleRequest) returns (SetPruneRuleResponse);
  rpc ClearPruneRule(ClearPruneRuleRequest) returns (ClearPruneRuleResponse);
  rpc GetPruneRule(GetPruneRuleRequest) returns (GetPruneRuleResponse);

  // Exempts (or un-exempts) every version of a package name from pruning.
  rpc SetPruneExemption(SetPruneExemptionRequest) returns (SetPruneExemptionResponse);
  rpc ListPruneExemptions(ListPruneExemptionsRequest) returns (ListPruneExemptionsResponse);

  // Runs pruning immediately, ignoring the schedule. Empty repo/channel
  // runs every configured rule. Requires `prune.enabled` in server config.
  rpc RunPrune(RunPruneRequest) returns (RunPruneResponse);
}

// Which repos a token may act on.
enum TokenScope {
  TOKEN_SCOPE_UNSPECIFIED = 0;
  // Every repo, including ones created after the token was issued.
  TOKEN_SCOPE_ALL = 1;
  // Exactly the repos listed in `repos`. One repo is just the
  // single-element case.
  TOKEN_SCOPE_REPOS = 2;
}

message CreateTokenRequest {
  string name = 1;
  // "read", "write", or "admin".
  string permission = 2;
  TokenScope scope = 3;
  repeated string repos = 4;
  // Unix seconds; 0 means the token never expires.
  int64 expires_at = 5;
}

message CreateTokenResponse {
  // The full token string — shown once, never recoverable afterwards.
  string token = 1;
  TokenInfo info = 2;
}

message TokenInfo {
  string id = 1;
  string name = 2;
  // Public lookup handle; the leading segment of the token string.
  string prefix = 3;
  string permission = 4;
  bool all_repos = 5;
  repeated string repos = 6;
  int64 created_at = 7;
  int64 expires_at = 8;
  int64 last_used_at = 9;
  int64 revoked_at = 10;
  string kind = 11;
}

message ListTokensRequest {
  bool include_revoked = 1;
}

message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}

message RevokeTokenRequest {
  // Either the token id or its name; whichever is set is used.
  string id = 1;
  string name = 2;
}

message RevokeTokenResponse {
  bool revoked = 1;
}

message CreateUserRequest {
  string username = 1;
  // Omit for a user who will only ever sign in through OIDC.
  string password = 2;
  bool is_admin = 3;
}

// One response message per RPC even where they carry the same thing today.
// Sharing one would mean that adding a field to any of these operations
// forces it onto all of them, and there is no compatible way out of that
// once clients exist.
message CreateUserResponse {
  UserInfo user = 1;
}

message SetUserDisabledResponse {
  UserInfo user = 1;
}

message SetUserPasswordResponse {
  UserInfo user = 1;
}

message UserInfo {
  string id = 1;
  string username = 2;
  bool is_admin = 3;
  bool disabled = 4;
  bool oidc_only = 5;
  int64 created_at = 6;
  int64 last_login_at = 7;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message SetUserDisabledRequest {
  string username = 1;
  bool disabled = 2;
}

message SetUserPasswordRequest {
  string username = 1;
  string password = 2;
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {
  bool deleted = 1;
}

message QueryAuditRequest {
  string action = 1;
  string repo = 2;
  string actor = 3;
  bool only_failures = 4;
  int32 limit = 5;
}

message QueryAuditResponse {
  repeated AuditEntry entries = 1;
}

message AuditEntry {
  int64 id = 1;
  int64 at = 2;
  string action = 3;
  string actor_kind = 4;
  string actor_name = 5;
  string repo = 6;
  string channel = 7;
  string target = 8;
  bool success = 9;
  string remote_addr = 10;
  // JSON object.
  string detail = 11;
}

message RebuildIndexRequest {
  string repo = 1;
  string channel = 2;
  PackageFormat format = 3;
  // The index unit: empty for rpm, an architecture for apk, a package
  // name for npm. Empty rebuilds every group of that format.
  string index_group = 4;
}

message RebuildIndexResponse {
  repeated string objects = 1;
  int32 groups_rebuilt = 2;
}

message DeletePackageRequest {
  int64 id = 1;
}

message DeletePackageResponse {
  bool deleted = 1;
  string storage_path = 2;
}

message SetRepoModeRequest {
  string repo = 1;
  RepoMode mode = 2;
}

message SetRepoModeResponse {
  string repo = 1;
  RepoMode mode = 2;
}

message CreateRepoRequest {
  string repo = 1;
  // Defaults to private if unspecified.
  RepoMode mode = 2;
}

message CreateRepoResponse {
  string repo = 1;
  RepoMode mode = 2;
}

message DeleteRepoRequest {
  string repo = 1;
  bool force = 2;
}

message DeleteRepoResponse {
  int32 packages_deleted = 1;
}

message PruneRule {
  string repo = 1;
  string channel = 2;
  // Unset means that rule isn't configured. Both may be set at once —
  // a version is pruned if it violates either one.
  optional int32 keep_last_n = 3;
  optional int32 max_age_days = 4;
  int64 updated_at = 5;
}

message SetPruneRuleRequest {
  string repo = 1;
  string channel = 2;
  // At least one of these is required.
  optional int32 keep_last_n = 3;
  optional int32 max_age_days = 4;
}

message SetPruneRuleResponse {
  PruneRule rule = 1;
}

message ClearPruneRuleRequest {
  string repo = 1;
  string channel = 2;
}

message ClearPruneRuleResponse {
  bool cleared = 1;
}

message GetPruneRuleRequest {
  string repo = 1;
  string channel = 2;
}

message GetPruneRuleResponse {
  // Unset means no rule is configured for this repo/channel.
  optional PruneRule rule = 1;
}

message SetPruneExemptionRequest {
  string repo = 1;
  string channel = 2;
  string name = 3;
  // true adds the exemption, false removes it.
  bool exempt = 4;
}

message SetPruneExemptionResponse {
  // The resulting state after the call.
  bool exempted = 1;
}

message ListPruneExemptionsRequest {
  string repo = 1;
  string channel = 2;
}

message ListPruneExemptionsResponse {
  repeated string names = 1;
}

message RunPruneRequest {
  // Empty runs every configured rule.
  string repo = 1;
  string channel = 2;
  // Reports what would be deleted without deleting anything.
  bool dry_run = 3;
}

message RunPruneResponse {
  bool dry_run = 1;
  repeated PruneCandidate candidates = 2;
  // 0 on a dry run.
  int32 deleted = 3;
  int32 failed = 4;
}

message PruneCandidate {
  int64 id = 1;
  string repo = 2;
  string channel = 3;
  PackageFormat format = 4;
  string index_group = 5;
  string name = 6;
  string version = 7;
  string release = 8;
  string arch = 9;
  string filename = 10;
  int64 published_at = 11;
  // "keep_last_n", "max_age", or both.
  repeated string matched_rules = 12;
}
