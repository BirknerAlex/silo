# silo-server keeps no local state: packages live in object storage and
# everything else lives in Postgres. Any replica can serve any request, so
# this is a plain Deployment that scales horizontally.
#
# Concurrent publishes are safe at any replica count — publishes take a
# Postgres advisory lock scoped to the index they'd rewrite, so two
# replicas publishing to the same repo/channel serialize, while unrelated
# repos, apk/pacman architectures and npm packages proceed in parallel.
replicaCount: 1

image:
  repository: tyrola/silo
  # Defaults to the chart's appVersion, so `helm upgrade` to a new chart
  # version moves the image with it. Override to pin, or to track `latest`.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ------------------------------------------------------- labels and metadata

# Added to the `metadata.labels` and `metadata.annotations` of every
# resource this chart creates. Use these for organisation-wide conventions
# (cost centre, team, environment) rather than repeating them per resource.
#
# Note what commonLabels deliberately does NOT touch: the Deployment's
# `spec.selector`. That field is immutable, so folding user labels into it
# would make adding one break every subsequent upgrade.
commonLabels: {}
commonAnnotations: {}

# Per-resource additions, merged on top of the common ones above. The
# annotation blocks are where controller-specific keys go — external-dns,
# cert-manager, cloud load balancers, IRSA — since those only make sense on
# one particular object.
deploymentLabels: {}
deploymentAnnotations: {}
podLabels: {}
podAnnotations: {}

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  automount: true
  labels: {}
  # For cloud object-storage identity, which removes the need for static
  # S3 credentials entirely:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/silo
  #   iam.gke.io/gcp-service-account: silo@project.iam.gserviceaccount.com
  annotations: {}

service:
  type: ClusterIP
  # gRPC and HTTP share this port; silo dispatches by path and by
  # per-connection protocol sniffing, not by a separate port.
  port: 8080
  labels: {}
  # e.g. external-dns.alpha.kubernetes.io/hostname, or a cloud
  # load-balancer class, when type is LoadBalancer.
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# e.g. {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0}}
strategy: {}

# Extra environment variables for the server container, in full env-var
# form (so `valueFrom` works). RUST_LOG is the common one.
extraEnv: []
  # - name: RUST_LOG
  #   value: info,silo_server=debug

# The image already runs as uid 10001 with no need to write to disk, so
# these are hardening on top of an already-unprivileged container rather
# than a prerequisite. Left empty by default because some clusters set
# them through a policy controller instead.
podSecurityContext: {}
  # runAsNonRoot: true
  # seccompProfile:
  #   type: RuntimeDefault
securityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # capabilities:
  #   drop: [ALL]

# ---------------------------------------------------------------- database

postgres:
  # A single-replica in-cluster Postgres for development and evaluation.
  #
  # Deliberately minimal and deliberately NOT for production: one pod, no
  # replication, no backups, no connection pooling, and an upgrade
  # restarts it. Point `externalPostgres` at a managed instance (RDS,
  # Cloud SQL, CloudNativePG, ...) for anything you care about.
  enabled: false
  image: postgres:16-alpine
  database: silo
  username: silo
  # Change this. Only used when postgres.enabled is true.
  password: silo
  # Set to an existing Secret with a `password` key to keep the password
  # out of values.yaml and Helm release history.
  existingSecret: ""
  persistence:
    # false uses an emptyDir — every restart loses the package index, and
    # the indexes then have to be rebuilt with `silo index rebuild`.
    enabled: true
    size: 8Gi
    storageClass: ""
  resources: {}

externalPostgres:
  # Full connection URL, e.g.
  #   postgres://silo:secret@postgres.internal:5432/silo?sslmode=require
  # Prefer `existingSecret` so credentials don't land in values.yaml.
  url: ""
  # Name of a Secret holding the URL. Takes precedence over `url`.
  existingSecret: ""
  existingSecretKey: "url"

# ------------------------------------------------------------------ config

# Rendered into the server's config.yaml. `database.url` is filled in
# automatically from the postgres/externalPostgres settings above, so it
# must not be set here.
#
# See the project README for the full schema.
config:
  publicBaseUrl: ""

  storage:
    bucket: silo
    region: us-east-1
    endpoint: ""
    allowHttp: false
    accessKeyId: ""
    secretAccessKey: ""
    # Name of a Secret with `accessKeyId`/`secretAccessKey` keys. Takes
    # precedence over the inline values above.
    existingSecret: ""

  auth:
    # Mint an admin token and user on first start against an empty
    # database, printed once to the pod log.
    bootstrap: true
    # Mixed into token hashes and never stored in the database, so a
    # database dump alone yields no usable credentials. Generate with
    # `openssl rand -hex 32`. Changing it invalidates every token.
    tokenPepper: ""
    tokenPepperExistingSecret: ""
    sessionTtlHours: 720

  audit:
    logDownloads: true
    retentionDays: 90

  metrics:
    enabled: true
    requireAuth: false

  # Optional single sign-on. Omit `issuer` to disable.
  oidc:
    issuer: ""
    clientId: ""
    usernameClaim: preferred_username
    scopes:
      - openid
      - profile
    adminClaim: ""
    adminValue: ""
    # Disable local password login once SSO is in place.
    exclusive: false

  signing:
    # RPM package + repomd signatures.
    gpg:
      # Inline armored private key, or use existingSecret.
      key: ""
      passphrase: ""
      # Secret with `key` and optionally `passphrase`.
      existingSecret: ""
    # APKINDEX signatures. `keyName` must match the filename the matching
    # public key is deployed to under /etc/apk/keys on clients.
    apk:
      key: ""
      keyName: ""
      existingSecret: ""
    # pacman repo database signature (a detached db.tar.gz.sig). A
    # separate key from `gpg` above — reuse the same armored key here if
    # one key signing both RPM and pacman repos is fine.
    pacman:
      key: ""
      passphrase: ""
      existingSecret: ""

# Supply the whole config.yaml verbatim instead of having the chart render
# it from the structured values above. Everything under `config:` is
# ignored when this is set.
configOverride: ""

# Name of a pre-existing Secret with a `config.yaml` key. Takes precedence
# over both `config` and `configOverride`.
existingConfigSecret: ""

# ------------------------------------------------------------------ probes

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

# Readiness depends on the database, so a replica that loses Postgres is
# taken out of the Service rather than serving 500s.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

serviceMonitor:
  # Requires the Prometheus Operator CRDs.
  enabled: false
  interval: 30s
  # Prometheus Operator instances usually select ServiceMonitors by label;
  # put whatever yours looks for here.
  labels: {}
  annotations: {}

ingress:
  # One Ingress for everything: gRPC (the `silo` CLI) and HTTP (dnf, apk,
  # npm, pacman) share the same Service port, and silo dispatches between them by
  # path and by per-connection protocol detection, not by anything the
  # ingress needs to understand. All the controller has to do is speak
  # real HTTP/2 to the backend rather than downgrading to HTTP/1.1 — no
  # gRPC-aware proxying required.
  #
  # Traefik does this by default: point it at the Service with
  #   traefik.ingress.kubernetes.io/service.serversscheme: h2c
  # and it forwards HTTP/2 frames as-is, gRPC or not. We recommend Traefik
  # for this reason.
  #
  # nginx can also do it, but only via plain `proxy_pass` with
  # `proxy_http_version 2`, which nginx open source has only supported
  # since 1.29.4 (December 2025) — earlier versions could speak HTTP/2 to
  # a backend solely through the gRPC-specific `grpc_pass` module, which
  # cannot carry the dnf/apk/npm/pacman traffic and would need a second Ingress.
  # If your ingress-nginx build doesn't yet expose `proxy_http_version 2`
  # through an annotation, force it with a snippet:
  #   nginx.ingress.kubernetes.io/configuration-snippet: |
  #     proxy_http_version 2;
  # If you're stuck on an older nginx and can't take the snippet, switch
  # ingress controllers — nginx's gRPC story here is effectively
  # deprecated in favor of controllers (Traefik, and others built on
  # generic HTTP/2 proxying) that never needed the special case.
  enabled: false
  className: ""
  labels: {}
  # Controller, TLS and DNS wiring all go here, e.g.
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   external-dns.alpha.kubernetes.io/hostname: packages.example.com
  #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
  annotations: {}
  hosts:
    - host: silo.example.com
      paths:
        - path: /
          pathType: Prefix
  # e.g. [{secretName: silo-tls, hosts: [silo.example.com]}]. With
  # cert-manager, naming a secret here is what triggers issuance.
  tls: []
