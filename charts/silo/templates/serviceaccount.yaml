{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "silo.serviceAccountName" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  # This is where cloud object-storage identity is wired up:
  # `eks.amazonaws.com/role-arn` for IRSA, or
  # `iam.gke.io/gcp-service-account` for GKE Workload Identity. Either lets
  # you leave config.storage.accessKeyId empty and drop static S3
  # credentials entirely.
  {{- include "silo.annotations" (dict "ctx" . "extra" .Values.serviceAccount.annotations) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
