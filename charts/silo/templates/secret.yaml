{{- if not .Values.existingConfigSecret }}
{{- /*
A Secret rather than a ConfigMap, because config.yaml can hold credentials
directly: storage.access_key_id/secret_access_key when no existingSecret
is given, auth.token_pepper, the signing keys and a GPG passphrase. The
values that keep those out of the file — the *existingSecret options — are
opt-in, so the default rendering is the one that has to be safe.

Whatever is not a credential is readable here anyway: `helm get manifest`
and `kubectl get secret -o yaml` both show it, so nothing is lost by not
splitting the file in two.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "silo.fullname" . }}-config
  labels:
    {{- include "silo.labels" . | nindent 4 }}
  {{- include "silo.annotations" (dict "ctx" . "extra" (dict)) }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "silo.config" . | nindent 4 }}
{{- end }}
