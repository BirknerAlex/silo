{{- if .Values.ingress.enabled }}
# One Ingress for both gRPC (the `silo` CLI) and HTTP (dnf/apk/npm): they
# share a Service port, and silo dispatches between them itself, so the
# controller only needs to speak real HTTP/2 to the backend rather than
# understanding gRPC. See the comment on `ingress` in values.yaml for how
# to get that out of your controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  # cert-manager's `cert-manager.io/cluster-issuer` and external-dns's
  # `external-dns.alpha.kubernetes.io/hostname` both belong here.
  {{- include "silo.annotations" (dict "ctx" . "extra" .Values.ingress.annotations) }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "silo.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
