<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="silo-title">
  <title id="silo-title">Silo</title>
  <defs>
    <!-- Cylinder shading: green rim light on the left, steel body, magenta on the right. -->
    <linearGradient id="silo-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39f58c"/>
      <stop offset=".16" stop-color="#e4e8f2"/>
      <stop offset=".55" stop-color="#a3a9be"/>
      <stop offset=".82" stop-color="#d03c9c"/>
      <stop offset="1" stop-color="#ff2fa8"/>
    </linearGradient>
    <linearGradient id="silo-roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39f58c"/>
      <stop offset=".3" stop-color="#ff5cc0"/>
      <stop offset="1" stop-color="#c2137f"/>
    </linearGradient>
  </defs>

  <g stroke="#1a1033" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Short silo -->
    <path d="M40 128 A30 26 0 0 1 100 128 V226 H40 Z" fill="url(#silo-steel)"/>
    <path d="M40 128 A30 26 0 0 1 100 128 Z" fill="url(#silo-roof)"/>
    <rect x="62" y="94" width="16" height="10" rx="3" fill="url(#silo-roof)"/>

    <!-- Tall silo -->
    <path d="M110 76 A42 36 0 0 1 194 76 V226 H110 Z" fill="url(#silo-steel)"/>
    <path d="M110 76 A42 36 0 0 1 194 76 Z" fill="url(#silo-roof)"/>
    <rect x="142" y="30" width="20" height="12" rx="4" fill="url(#silo-roof)"/>
  </g>

  <!-- Pipe from the tall dome down the right side -->
  <path d="M190 62 H210 V226" fill="none" stroke="#1a1033" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M190 62 H210 V226" fill="none" stroke="#39f58c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hoop bands -->
  <g stroke="#1a1033" stroke-width="3.5" opacity=".55">
    <path d="M43 152 H97 M43 176 H97 M43 200 H97"/>
    <path d="M113 104 H191 M113 130 H191 M113 156 H191 M113 182 H191"/>
  </g>

  <!-- Bay door -->
  <g stroke="#1a1033" stroke-width="5" stroke-linejoin="round">
    <rect x="134" y="192" width="36" height="34" rx="2" fill="#2a1d4d"/>
  </g>
  <path d="M138 202 H166 M138 210 H166 M138 218 H166" stroke="#39f58c" stroke-width="2.5" opacity=".7"/>
</svg>
