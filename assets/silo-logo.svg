<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- backdrop -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0a0e14"/>
      <stop offset="1"   stop-color="#12101c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#22EE45"/>
      <stop offset="1"   stop-color="#FF007B"/>
    </linearGradient>

    <!-- body fill: near-black glass with a faint tint -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1a2a22" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#1a1420" stop-opacity="0.9"/>
    </linearGradient>

    <!-- neon glow filters -->
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoftGreen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glowSoftPink" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- rounded-square badge; everything outside this is transparent -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.55"/>

  <!-- faint scanlines for texture -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="56" y1="120" x2="456" y2="120"/>
    <line x1="56" y1="160" x2="456" y2="160"/>
    <line x1="56" y1="200" x2="456" y2="200"/>
    <line x1="56" y1="352" x2="456" y2="352"/>
    <line x1="56" y1="392" x2="456" y2="392"/>
  </g>

  <!-- soft ambient glows behind the silo -->
  <ellipse cx="222" cy="220" rx="90" ry="130" fill="#22EE45" opacity="0.16" filter="url(#glowSoftGreen)"/>
  <ellipse cx="300" cy="360" rx="90" ry="110" fill="#FF007B" opacity="0.14" filter="url(#glowSoftPink)"/>

  <!-- silo body outline, glass fill -->
  <path d="
    M188 176
    Q256 92 324 176
    L324 388
    Q324 424 288 424
    L224 424
    Q188 424 188 388
    Z"
    fill="url(#glassFill)"/>

  <!-- dome + cap: pink neon, cap flush on the dome apex (peak ~ y=134) -->
  <g filter="url(#glowPink)">
    <path d="M188 176 Q256 92 324 176" fill="none" stroke="#FF007B" stroke-width="4" stroke-linecap="round"/>
    <rect x="240" y="108" width="32" height="26" rx="6" fill="none" stroke="#FF007B" stroke-width="4"/>
  </g>

  <!-- body outline + base: green neon -->
  <g filter="url(#glowGreen)">
    <path d="
      M188 176
      L188 388
      Q188 424 224 424
      L288 424
      Q324 424 324 388
      L324 176"
      fill="none" stroke="#22EE45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- corrugation lines, faint dual tone -->
  <g stroke-width="1.6" opacity="0.5">
    <line x1="212" y1="186" x2="212" y2="418" stroke="#22EE45"/>
    <line x1="238" y1="180" x2="238" y2="422" stroke="#22EE45"/>
    <line x1="274" y1="180" x2="274" y2="422" stroke="#FF007B"/>
    <line x1="300" y1="186" x2="300" y2="418" stroke="#FF007B"/>
  </g>

  <!-- horizontal bands, alternating neon -->
  <g filter="url(#glowGreen)">
    <line x1="188" y1="252" x2="324" y2="252" stroke="#22EE45" stroke-width="3"/>
  </g>
  <g filter="url(#glowPink)">
    <line x1="188" y1="322" x2="324" y2="322" stroke="#FF007B" stroke-width="3"/>
  </g>

  <!-- three package chips, alternating neon -->
  <g filter="url(#glowGreen)">
    <rect x="150" y="452" width="32" height="32" rx="7" fill="#12101c" stroke="#22EE45" stroke-width="3"/>
  </g>
  <g filter="url(#glowPink)">
    <rect x="240" y="462" width="32" height="32" rx="7" fill="#12101c" stroke="#FF007B" stroke-width="3"/>
  </g>
  <g filter="url(#glowGreen)">
    <rect x="330" y="452" width="32" height="32" rx="7" fill="#12101c" stroke="#22EE45" stroke-width="3"/>
  </g>

  <!-- connecting lines -->
  <g stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="224" y1="424" x2="180" y2="452" stroke="#22EE45"/>
    <line x1="256" y1="424" x2="256" y2="462" stroke="#FF007B"/>
    <line x1="288" y1="424" x2="338" y2="452" stroke="#22EE45"/>
  </g>
</svg>
