[workspace]
resolver = "2"
members = [
    "crates/silo-proto",
    "crates/silo-rpm",
    "crates/silo-core",
    "crates/silo-server",
    "crates/silo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BirknerAlex/silo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
object_store = { version = "0.11", features = ["aws"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
rpm = "0.27"
pgp = "0.14"
rand = "0.8"

[profile.release]
lto = true
