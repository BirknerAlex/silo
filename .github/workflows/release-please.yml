name: release-please

# Versioning is derived from commit messages rather than decided by hand.
# release-please watches main, keeps a release PR open with the version
# bump and the changelog it has accumulated, and cuts the tag when that PR
# is merged. Merging is the only manual step, and it is the one that
# should be manual.
#
# What decides the bump, per Conventional Commits:
#   fix:              -> patch
#   feat:             -> minor
#   feat!: / BREAKING -> major
#
# The tag it pushes is what `release.yml` builds and publishes.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# These are a ceiling, not a grant: the repository's own Actions setting
# (Settings -> Actions -> General -> Workflow permissions) has to allow
# read *and* write, and allow Actions to create pull requests. Left at the
# read-only default, this job fails on the API call rather than on
# anything in the config below.
permissions:
  contents: write
  pull-requests: write
  # To dispatch release.yml once a release exists; see the last step.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # The config uses `release-type: simple` with explicit
          # `extra-files` rather than `rust`. `rust` looks like the right
          # choice and is not: it applies a `[package]` updater to the root
          # Cargo.toml, which here is a virtual workspace with no
          # `[package]` section, and the whole run fails. See
          # .release-please-config.json and AGENTS.md.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN does not start a workflow: GitHub
      # suppresses that so workflows cannot trigger themselves. So
      # `release.yml`'s `on: push: tags` would never fire for the tag cut
      # just above, and the release would sit there with nothing built.
      #
      # `workflow_dispatch` is the documented exception to that rule, and
      # release.yml already takes the tag as an input — it was there for
      # re-running a failed publish, and serves double duty here.
      - name: build and publish the release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "dispatching release.yml for $TAG"
          gh workflow run release.yml -f tag="$TAG" --repo "${{ github.repository }}"
