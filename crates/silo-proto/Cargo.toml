[package]
name = "silo-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tonic.workspace = true
prost.workspace = true
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

# cargo-machete reads `use` statements, and neither of these appears in
# any source file: `prost` and `tonic-prost` are referenced by the code
# tonic-prost-build generates, and `tonic-prost-build` is only ever
# called from build.rs. Removing any of them breaks the build.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost", "tonic-prost-build"]
