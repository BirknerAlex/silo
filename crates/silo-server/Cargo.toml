[package]
name = "silo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "silo-server"
path = "src/main.rs"

[dependencies]
silo-core = { path = "../silo-core" }
silo-db = { path = "../silo-db" }
silo-proto = { path = "../silo-proto" }
silo-pkg = { path = "../silo-pkg" }
tokio.workspace = true
tonic.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
prometheus.workspace = true
sqlx.workspace = true
base64.workspace = true
cron.workspace = true

[dev-dependencies]
tower = "0.5"
silo-core = { path = "../silo-core", features = ["test-util"] }
silo-pkg = { path = "../silo-pkg", features = ["test-util"] }
# The integration tests inflate APKINDEX/pacman-db payloads to assert their
# contents.
flate2 = "1"
tar = "0.4"
